name: Tern lab protocol proof
on:
  pull_request:
    paths:
      - 'cli/experiments/tern/**'
      - 'cli/src/presentation/**'
      - 'cli/src/commands/packet/info-surface.ts'
      - '.github/workflows/tern-lab-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the locked SDK and compiler, without lifecycle scripts
        working-directory: cli/experiments/tern
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile shared model and require real-SDK fake-peer tests
        working-directory: cli/experiments/tern
        env:
          TERN_REQUIRE_SDK: '1'
        run: npm test
