name: Port Build

# Full end-to-end builds for the non-Darwin port (#1673, #1672):
# npm ci → Next build → tauri-export → cargo tauri build → installers as
# downloadable artifacts. The compile gates in ci.yml catch the rustc class
# cheaply on every PR; this workflow proves the REST of the pipeline (the
# Node build scripts, linking, bundling) and produces .msi/.deb/.AppImage
# artifacts to smoke-test on real machines. Manual + weekly — a full native
# build is too heavy for the PR lane.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing public release tag to receive Windows/Linux preview installers (for example v0.1.662)'
        required: false
        type: string
      replace_existing_assets:
        description: 'Replace existing Windows/Linux assets for the selected release tag'
        required: false
        default: false
        type: boolean
      sign_windows:
        description: 'Require Azure Artifact Signing for the Windows release build'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 10 * * 2'

permissions:
  contents: read

concurrency:
  group: port-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual publish rebuilds the exact public tag. Blank manual and
          # scheduled runs retain the ordinary Actions-artifact behavior.
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock is generated by npm 11 on the dev machines; Node 22 bundles
      # npm 10 — one npm version everywhere (see ci.yml).
      - run: npm install -g npm@11
      # The repo's npm scripts are authored for a POSIX sh (`sh -c '…'`).
      # GitHub's Windows runners ship Git Bash, so point npm at it instead
      # of cmd.exe. Making the scripts shell-neutral is tracked as a
      # contributor task on #1673.
      - if: runner.os == 'Windows'
        run: npm config set script-shell bash
      # Tauri v2 system deps for Linux bundling (webkit2gtk 4.1 line);
      # libfuse2 for appimagetool; libayatana-appindicator3-dev because o8 has
      # a tray icon and the tauri CLI PANICS pre-bundle without an appindicator
      # lib (run 31055946225 — the panic doesn't even fail the build step,
      # which is why the empty-upload guard below is load-bearing). No ALSA —
      # audio deps are macOS-only.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libssl-dev build-essential libfuse2 libayatana-appindicator3-dev libvips-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-gl
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - run: npm ci --prefer-offline
      # Public release AppImages are signed with o8's durable Linux release
      # identity. Scheduled build artifacts remain unsigned diagnostics.
      - name: Configure Linux release signing
        if: runner.os == 'Linux' && inputs.release_tag != ''
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_KEY_ID: ${{ vars.LINUX_GPG_KEY_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$LINUX_GPG_PRIVATE_KEY" || -z "$LINUX_GPG_KEY_ID" ]]; then
            echo "Linux release signing credentials are not configured" >&2
            exit 1
          fi

          signing_home="$RUNNER_TEMP/o8-release-gpg"
          install -d -m 700 "$signing_home"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --homedir "$signing_home" --batch --import

          imported_fingerprint="$(
            gpg --homedir "$signing_home" --batch --with-colons \
              --list-secret-keys "$LINUX_GPG_KEY_ID" \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          if [[ "$imported_fingerprint" != "$LINUX_GPG_KEY_ID" ]]; then
            echo "Imported Linux signing key does not match LINUX_GPG_KEY_ID" >&2
            exit 1
          fi

          {
            echo "GNUPGHOME=$signing_home"
            echo "SIGN=1"
            echo "SIGN_KEY=$LINUX_GPG_KEY_ID"
            echo "APPIMAGETOOL_FORCE_SIGN=1"
          } >> "$GITHUB_ENV"
      - name: Configure Windows release signing
        if: runner.os == 'Windows' && inputs.release_tag != '' && inputs.sign_windows
        shell: pwsh
        env:
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'

          $required = @(
            'AZURE_ARTIFACT_SIGNING_ACCOUNT',
            'AZURE_ARTIFACT_SIGNING_ENDPOINT',
            'AZURE_ARTIFACT_SIGNING_PROFILE',
            'AZURE_CLIENT_ID',
            'AZURE_CLIENT_SECRET',
            'AZURE_TENANT_ID'
          )
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Windows release signing value $name is not configured"
            }
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$name=$value"
          }

          cargo install artifact-signing-cli --version 0.11.0 --locked
      # The config overlay disables updater artifacts because the updater key
      # never leaves the macOS ship machine. Tagged Linux builds add GPG
      # signing; tagged Windows builds can add Authenticode through a second
      # overlay once the verified publisher identity is available.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # linuxdeploy's strip pass is a notorious CI failure ("failed to run
          # linuxdeploy" with stderr swallowed — run 31056828226, where deb and
          # rpm bundled fine and only AppImage died). Standard remedy.
          NO_STRIP: true
        with:
          # --verbose so the bundler passes through linuxdeploy's own stderr —
          # without it the AppImage failure is a bare "failed to run
          # linuxdeploy" (rounds 5-7, with NO_STRIP and the gstreamer set
          # already ruled out as cures).
          args: >-
            --verbose --config
            ${{ runner.os == 'Windows' && inputs.release_tag != '' && inputs.sign_windows && 'src-tauri/tauri.portci.windows-signed.conf.json' || 'src-tauri/tauri.portci.conf.json' }}
      - name: Verify Linux AppImage signature is embedded
        if: runner.os == 'Linux' && inputs.release_tag != ''
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' appimages < <(
            find src-tauri/target/release/bundle -type f -name '*.AppImage' -print0
          )
          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "expected exactly one AppImage, found ${#appimages[@]}" >&2
            exit 1
          fi

          chmod +x "${appimages[0]}"
          signature="$("${appimages[0]}" --appimage-signature)"
          if [[ -z "$signature" ]]; then
            echo "AppImage does not contain an embedded signature" >&2
            exit 1
          fi
          echo "AppImage embedded signature is present"
      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows' && inputs.release_tag != '' && inputs.sign_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installers = @(
            Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle' -Recurse -File |
              Where-Object { $_.Extension -in @('.exe', '.msi') }
          )
          if ($installers.Count -lt 2) {
            throw "Expected signed MSI and EXE installers, found $($installers.Count)"
          }

          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature on $($installer.Name): $($signature.Status)"
            }
            Write-Host "Valid Authenticode signature: $($installer.Name)"
          }
      # Instrumentation: round 3 showed the bundler PRINTING built installer
      # paths while the upload step found the directory empty — list what
      # actually exists on disk between the two so the discrepancy is visible.
      - if: always()
        shell: bash
        run: ls -laR src-tauri/target/release/bundle 2>/dev/null || echo "bundle dir missing at upload time"
      # Upload every produced bundle form — first runs showed the exact
      # artifact names vary (AppImage vs AppImage.tar.gz etc.), so grab the
      # whole bundle tree and fail loudly if the build produced nothing.
      # if: always() — a partial bundle (deb + rpm good, AppImage failed) is
      # still worth capturing; the empty-dir error covers the nothing case.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o8-port-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 7

  publish-preview:
    name: Publish Windows/Linux previews
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: o8-port-*
          path: downloaded-artifacts
      - name: Validate tag and collect public preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must look like v0.1.662" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$version" ]]; then
            echo "package version $package_version does not match $RELEASE_TAG" >&2
            exit 1
          fi

          is_draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft')"
          if [[ "$is_draft" != "false" ]]; then
            echo "$RELEASE_TAG is not an existing public release" >&2
            exit 1
          fi

          mkdir release-assets
          copy_one() {
            local pattern="$1"
            local destination="$2"
            local matches=()
            while IFS= read -r -d '' path; do
              matches+=("$path")
            done < <(find downloaded-artifacts -type f -name "$pattern" -print0)
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "expected exactly one $pattern, found ${#matches[@]}" >&2
              exit 1
            fi
            cp "${matches[0]}" "release-assets/$destination"
          }

          copy_one "o8_${version}_x64_en-US.msi" "o8_${version}_windows_x64_preview.msi"
          copy_one "o8_${version}_x64-setup.exe" "o8_${version}_windows_x64_preview.exe"
          copy_one "o8_${version}_amd64.AppImage" "o8_${version}_linux_amd64_preview.AppImage"
          copy_one "o8_${version}_amd64.deb" "o8_${version}_linux_amd64_preview.deb"
          copy_one "o8-${version}-1.x86_64.rpm" "o8_${version}_linux_x86_64_preview.rpm"

          (
            cd release-assets
            sha256sum o8_* > SHA256SUMS-windows-linux-preview.txt
          )
      - name: Attest public preview assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: '${{ github.workspace }}/release-assets/*'
      - name: Upload public preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPLACE_EXISTING_ASSETS: ${{ inputs.replace_existing_assets }}
        shell: bash
        run: |
          set -euo pipefail

          upload_args=()
          if [[ "$REPLACE_EXISTING_ASSETS" == "true" ]]; then
            upload_args+=(--clobber)
          fi
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" "${upload_args[@]}"
