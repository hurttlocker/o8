name: Tern viewer ownership proof
on:
  pull_request:
    paths:
      - 'cli/experiments/tern/**'
      - 'cli/src/presentation/**'
      - 'src/lib/runtimes/pi/**'
      - 'src/lib/pi/**'
      - 'src/lib/approvals/**'
      - '.github/workflows/tern-viewer-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tern-viewer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Node 22 ships npm 10, whose npm ci rejects the npm-11 root lockfile, as in ci.yml.
      - run: npm install -g npm@11
      - run: npm ci --prefer-offline
      - name: Install the locked SDK and build the S2 model
        run: |
          npm --prefix cli/experiments/tern ci --ignore-scripts --no-audit --no-fund
          npm --prefix cli/experiments/tern run build
      - name: Real owning-runtime and observer-process regressions
        run: npx vitest run --config cli/experiments/tern/vitest.ownership.config.ts
      - name: Real-SDK proof (missing SDK fails)
        env:
          TERN_REQUIRE_SDK: '1'
        run: npm --prefix cli/experiments/tern test
      - run: npm run test:classification:check
