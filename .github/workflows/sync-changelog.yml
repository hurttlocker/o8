name: Sync Public Changelog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          cat > /tmp/CHANGELOG.md << 'HEADER'
          # Changelog

          Development activity for Rainwater IDE.

          ---
          HEADER

          current_date=""
          git log --format="%as|%h|%s" --no-merges | while IFS='|' read -r date hash msg; do
            if [ "$date" != "$current_date" ]; then
              echo ""
              echo "## $date"
              echo ""
              current_date="$date"
            fi

            # --- Sanitize commit messages ---

            # Drop security-sensitive commits entirely
            if echo "$msg" | grep -qiE 'injection|race.condition|crash|vulnerability|xss|csrf|auth.fix|exploit|CVE|secret|credential|password'; then
              msg="fix: Security hardening"
            fi

            # Strip internal project/codename references
            msg=$(echo "$msg" | sed -E \
              -e 's/Cortex IDE/Rainwater/gi' \
              -e 's/Cortex-aware/context-aware/gi' \
              -e 's/CortexClient/client/gi' \
              -e 's/\.cortexrules/project rules/gi' \
              -e 's/Cortex ?[Mm]emory/Memory/gi' \
              -e 's/Cortex/Rainwater/gi' \
              -e 's/OpenClaw/agent runtime/gi' \
              -e 's/NemoClaw/agent runtime/gi' \
              -e 's/PicoClaw/bundled runtime/gi' \
              -e 's/Codex/agent runtime/gi' \
              -e 's/Claude Code/agent runtime/gi' \
              -e 's/Tauri/native shell/gi' \
              -e 's/Drizzle/ORM/gi' \
              -e 's/better-sqlite3?/database/gi' \
              -e 's/Gemini/AI provider/gi' \
              -e 's/Claude/AI provider/gi' \
              -e 's/Anthropic/AI provider/gi' \
              -e 's/GPT-?[0-9.]*/AI model/gi' \
              -e 's/API [Kk]ey[s]?/configuration/gi' \
              -e 's/BYOK/bring-your-own/gi' \
              -e 's/tmux/terminal/gi')

            # Strip issue/PR numbers
            msg=$(echo "$msg" | sed -E 's/ *\(#[0-9]+\)//g; s/ *#[0-9]+//g')

            # Strip long implementation details after em-dash
            msg=$(echo "$msg" | sed -E 's/ — .{40,}//g')

            # Clean up trailing prepositions left by stripping
            msg=$(echo "$msg" | sed -E 's/ (of|for|via|from|with|in) *$//')

            echo "- \`$hash\` $msg"
          done >> /tmp/CHANGELOG.md

      - name: Generate stats
        run: |
          echo "# Development Stats" > /tmp/STATS.md
          echo "" >> /tmp/STATS.md
          echo "Last updated: $(date -u +%Y-%m-%d)" >> /tmp/STATS.md
          echo "" >> /tmp/STATS.md
          echo "| Metric | Value |" >> /tmp/STATS.md
          echo "|---|---|" >> /tmp/STATS.md
          echo "| Total commits | $(git rev-list --count HEAD) |" >> /tmp/STATS.md
          echo "| Days active | $(git log --format="%as" | sort -u | wc -l | tr -d ' ') |" >> /tmp/STATS.md
          echo "| This week | $(git log --since='7 days ago' --oneline --no-merges | wc -l | tr -d ' ') commits |" >> /tmp/STATS.md
          echo "| Today | $(git log --since='1 day ago' --oneline --no-merges | wc -l | tr -d ' ') commits |" >> /tmp/STATS.md

      - name: Push to public repo
        env:
          TOKEN: ${{ secrets.PUBLIC_CHANGELOG_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/hurttlocker/Rainwater.git /tmp/public
          cp /tmp/CHANGELOG.md /tmp/public/CHANGELOG.md
          cp /tmp/STATS.md /tmp/public/STATS.md

          # Remove ROADMAP — too much architecture detail
          rm -f /tmp/public/ROADMAP.md

          cd /tmp/public
          git config user.name "hurttlocker"
          git config user.email "noreply@hurttlocker.dev"
          git add -A
          git diff --cached --quiet || git commit -m "sync: Update changelog $(date -u +%Y-%m-%d)"
          git push
