name: CI

# Runs on every pull request and on every push to main. The repo is public,
# so Linux and Windows runners are free; the main-branch run keeps the README
# badge and the default-branch status honest after each merge (Q ruling
# 2026-09-11, reversing the PR-only rule from the private-repo days).
# A weekly run keeps integration coverage and dependency audits current;
# workflow_dispatch remains the on-demand path for a full remote check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 0'
    # Monday check: opens the weekly-lane issue when no Sunday run passed in
    # the last 8 days, which catches a cron GitHub dropped (#2391).
    - cron: '41 13 * * 1'
  workflow_dispatch:
    inputs:
      integration_base:
        description: 'Base ref for the changed-files integration lane. Empty runs the whole weekly suite.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.integration_base }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock is generated by npm 11 on the dev machines; Node 22 bundles
      # npm 10, whose `npm ci` validator rejects npm-11 lock graphs with
      # phantom "Missing: <pkg> from lock file" errors (live-hit 2026-07-05,
      # broke every PR + main). One npm version everywhere.
      - run: npm install -g npm@11
      - run: npm ci --prefer-offline
      - run: npm run protocol:check
      - run: npm run typecheck
      # These bounded publication fixtures never contact release services or
      # build an app. Keep the stable/preview boundary on every PR.
      - name: Release channel policy
        run: npx vitest run tests/release-channel-real-path.test.ts

  # Lint restored to the PR lane 2026-07-18 (#1547): the error debt is burned
  # to zero on main (the old 398 baseline was mostly a stale nested worktree
  # being linted). Warnings don't fail the job; errors do.
  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock is generated by npm 11 on the dev machines; Node 22 bundles
      # npm 10, whose `npm ci` validator rejects npm-11 lock graphs with
      # phantom "Missing: <pkg> from lock file" errors (live-hit 2026-07-05,
      # broke every PR + main). One npm version everywhere.
      - run: npm install -g npm@11
      - run: npm ci --prefer-offline
      - run: npm run lint

  test:
    name: Hermetic Unit Tests
    if: github.event.schedule != '41 13 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock is generated by npm 11 on the dev machines; Node 22 bundles
      # npm 10, whose `npm ci` validator rejects npm-11 lock graphs with
      # phantom "Missing: <pkg> from lock file" errors (live-hit 2026-07-05,
      # broke every PR + main). One npm version everywhere.
      - run: npm install -g npm@11
      - run: npm ci --prefer-offline
      - run: npm run test:classification:check
      - run: npm run test:unit

  # PR lane (#2391): runs exactly the resource-owning test files the branch
  # touches, diffed from the merge-base with the base branch. No touched files
  # means the test steps skip and the check passes. No continue-on-error: a red
  # file fails the check. workflow_dispatch with integration_base runs the same
  # lane against that base.
  # Measured 2026-09-17, run 35178958985 (dispatch, integration_base=HEAD~40):
  # 18 touched files in 171.5s of gate time, 3m40s for the whole job including
  # npm ci. Whole-suite files average 6.2s each, so the 20-minute limit covers
  # a PR touching roughly 150 resource-owning files.
  integration-changed:
    name: Integration Tests (changed files)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.integration_base != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select touched resource-owning tests
        id: select
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || inputs.integration_base }}
        run: node scripts/ci/resource-owning-changed.mjs "$BASE_REF"
      - if: steps.select.outputs.count != '0'
        run: npm install -g npm@11
      - if: steps.select.outputs.count != '0'
        run: npm ci --prefer-offline
      - if: steps.select.outputs.count != '0'
        run: npm run test:integration -- ${{ steps.select.outputs.files }}

  # Weekly whole-suite lane, split into two halves of the manifest file list.
  # Unsharded, the suite does not fit 45 minutes: the 2026-09-13 scheduled run
  # reached file 310/425 when the 45-minute limit cancelled it.
  # Measured 2026-09-17, run 35178955102 (dispatch, 444 files): shard 1 took
  # 222 files in 1248s of gate time and a 21m42s job; shard 2 took 222 files in
  # 1525s and a 26m17s job. That is 46m of test time unsharded. The 40-minute
  # limit is about 1.5x the slower shard. Baseline on that run: 45 files red
  # on Linux (20 + 25).
  # A failed, timed-out, or cancelled Sunday run opens or updates the
  # "Weekly integration lane did not pass" issue; the Monday cron does the same
  # when no Sunday run passed, and closes the issue once one has.
  integration-weekly-1:
    name: Weekly Integration Tests (shard 1/2)
    runs-on: ubuntu-latest
    needs: test
    if: github.event.schedule == '17 5 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.integration_base == '')
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci --prefer-offline
      - run: npm run test:classification:check
      - run: npm run test:integration
        env:
          O8_INTEGRATION_SHARD: 1/2

  integration-weekly-2:
    name: Weekly Integration Tests (shard 2/2)
    runs-on: ubuntu-latest
    needs: test
    if: github.event.schedule == '17 5 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.integration_base == '')
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci --prefer-offline
      - run: npm run test:integration
        env:
          O8_INTEGRATION_SHARD: 2/2

  integration-weekly-report:
    name: Weekly Integration Report
    needs: [integration-weekly-1, integration-weekly-2]
    if: always() && github.event.schedule == '17 5 * * 0' && (needs.integration-weekly-1.result != 'success' || needs.integration-weekly-2.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/ci/weekly-integration-issue.sh open
          "Shard 1/2: ${{ needs.integration-weekly-1.result }}. Shard 2/2: ${{ needs.integration-weekly-2.result }}."

  integration-weekly-watch:
    name: Weekly Integration Watch
    if: github.event.schedule == '41 13 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since="$(date -u -d '8 days ago' +%Y-%m-%d)"
          passed=''
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event schedule \
              --created ">=$since" --limit 20 --json databaseId --jq '.[].databaseId'); do
            [ "$run" = "$GITHUB_RUN_ID" ] && continue
            ok="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '[.jobs[] | select(.name | startswith("Weekly Integration Tests")) | .conclusion] | length == 2 and all(. == "success")')"
            if [ "$ok" = true ]; then passed="$run"; break; fi
          done
          if [ -n "$passed" ]; then
            scripts/ci/weekly-integration-issue.sh close "Weekly run $passed passed both shards."
          else
            scripts/ci/weekly-integration-issue.sh open "No scheduled run since $since passed both weekly shards. The Sunday cron was dropped, failed, or timed out."
          fi

  # Launch posture: surface high-severity dependency findings without making
  # the first OSS PRs unmergeable. Remove continue-on-error once the remaining
  # semver-major advisories have been adjudicated.
  security:
    name: Security Audit
    if: github.event.schedule != '41 13 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      # The dependency-review API is Advanced-Security-gated on private repos
      # (live 403, first CI run 2026-07-30). Self-arms at the public flip.
      - name: Review dependency changes
        if: github.event_name == 'pull_request' && !github.event.repository.private
        uses: actions/dependency-review-action@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - name: Audit root dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # RUSTSEC-2026-0195: quick-xml >=0.41 is blocked by xcb 1.7.0, tauri-winrt-notification 0.7.2, and Tauri's plist 1.8.0.
          # RUSTSEC-2026-0194: quick-xml >=0.41 is blocked by xcb 1.7.0, tauri-winrt-notification 0.7.2, and Tauri's plist 1.8.0.
          # RUSTSEC-2026-0104: rustls-webpki 0.102.8 is pinned by sentry 0.34.0 through rustls 0.22.4.
          # RUSTSEC-2026-0098: rustls-webpki 0.102.8 is pinned by sentry 0.34.0 through rustls 0.22.4.
          # RUSTSEC-2026-0099: rustls-webpki 0.102.8 is pinned by sentry 0.34.0 through rustls 0.22.4.
          # RUSTSEC-2026-0049: rustls-webpki 0.102.8 is pinned by sentry 0.34.0 through rustls 0.22.4.
          # RUSTSEC-2026-0235: rkyv >=0.8.17 is blocked by rust_decimal 1.40.0 (rkyv 0.7 line) via byte-unit 5.2.0; o8 never deserializes rkyv archives.
          ignore: RUSTSEC-2026-0195,RUSTSEC-2026-0194,RUSTSEC-2026-0104,RUSTSEC-2026-0098,RUSTSEC-2026-0099,RUSTSEC-2026-0049,RUSTSEC-2026-0235

  governance-smoke:
    name: Governance Smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # timeout is load-bearing: this job hung at the 6h GitHub ceiling 3x on
    # 2026-07-11 (open handle keeps node alive after the smoke passes) —
    # ~360 billed min per hang. The step-level `timeout` fails fast; the
    # job-level cap is the backstop.
    timeout-minutes: 10
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock is generated by npm 11 on the dev machines; Node 22 bundles
      # npm 10, whose `npm ci` validator rejects npm-11 lock graphs with
      # phantom "Missing: <pkg> from lock file" errors (live-hit 2026-07-05,
      # broke every PR + main). One npm version everywhere.
      - run: npm install -g npm@11
      - run: npm ci --prefer-offline
      - name: Merge-requires-review governance gate
        run: timeout --signal=KILL 300 env CORTEX_IDE_DATA_DIR=$(mktemp -d) NODE_OPTIONS=--conditions=react-server npx tsx scripts/smoke-merge-requires-review.ts

  # Build removed from the PR lane 2026-07-11 (Q ruling: "runs through money
  # too quick for no reason") — at ~9 billed min/run x ~100 PR runs/week it was
  # the most expensive green job, re-verifying what the real signed build does
  # at ship time anyway. Run on-demand via workflow_dispatch when a remote
  # build check is genuinely wanted.
  build:
    name: Build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock is generated by npm 11 on the dev machines; Node 22 bundles
      # npm 10, whose `npm ci` validator rejects npm-11 lock graphs with
      # phantom "Missing: <pkg> from lock file" errors (live-hit 2026-07-05,
      # broke every PR + main). One npm version everywhere.
      - run: npm install -g npm@11
      - run: npm ci --prefer-offline
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ── Non-Darwin compile gates (#1673 Windows, #1672 Linux) ──────────────────
  # The port work is mapped (docs/internals/port-audit-windows.md) but until
  # these jobs existed nothing ever compiled the Rust shell on a non-Darwin
  # target — every enumerated blocker was invisible to CI, and a contributor
  # without a Mac had no way to verify anything. `cargo check` of the Tauri
  # crate catches the compile-time class (un-cfg'd macOS-only code,
  # target-gated deps, path-dep resolution) without needing a frontend build.
  #
  # Both targets compile clean as of run 31047139210 (2026-08-05), so the
  # gates are BLOCKING — a PR that breaks non-Darwin compilation goes red.
  # Public repo → these runners are free; both jobs are PR/dispatch-only like
  # the rest of event CI.
  rust-check-windows:
    name: Rust Compile Gate (Windows)
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      # tauri's codegen validates frontendDist AND bundle resources at compile
      # time; CI never runs the Next build, so stub both directories it points
      # at (../out/frontend, ../out/server). The dev-mcp-plugin dep needs no
      # stub anymore — the plugin is vendored in-repo (tauri-plugin-mcp/).
      - run: New-Item -ItemType Directory -Force -Path out/frontend, out/server | Out-Null
        shell: pwsh
      - run: cargo check --locked
        working-directory: src-tauri

  rust-check-linux:
    name: Rust Compile Gate (Linux)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Tauri v2 system deps for linux builds (webkit2gtk 4.1 line). No ALSA
      # headers needed — the audio crates are target-gated to macOS.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libssl-dev build-essential
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - run: mkdir -p out/frontend out/server
      - run: cargo check --locked
        working-directory: src-tauri

  roadmap-check:
    name: Roadmap Drift Check
    if: github.event_name == 'push' || github.event.schedule == '17 5 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails when a tracking-issue checklist claims a child shipped that is
      # still open, or when ROADMAP.md's Now section links a closed issue.
      # Closed-but-unreleased children are listed as awaiting release, not
      # failed. Read-only; touches no files.
      - name: Check ROADMAP.md against the tracking issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/roadmap-status.mjs --check
