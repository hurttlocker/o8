name: CI

# PR-only since 2026-07-08 (Actions-billing discipline, Q ruling). The push
# trigger re-verified work the LOCAL gate already ran (npx tsc --noEmit + npm
# test before every commit per CLAUDE.md, real build at ship time) — at ~20
# direct pushes/day × ~17 job-minutes that was the entire Actions bill for
# zero new signal. PRs are the un-gated lanes (PR agents), so CI stays there.
# Run on-demand against main via workflow_dispatch when a full remote check
# is wanted.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock is generated by npm 11 on the dev machines; Node 22 bundles
      # npm 10, whose `npm ci` validator rejects npm-11 lock graphs with
      # phantom "Missing: <pkg> from lock file" errors (live-hit 2026-07-05,
      # broke every PR + main). One npm version everywhere.
      - run: npm install -g npm@11
      - run: npm ci --prefer-offline
      - run: npm run typecheck

  # Lint restored to the PR lane 2026-07-18 (#1547): the error debt is burned
  # to zero on main (the old 398 baseline was mostly a stale nested worktree
  # being linted). Warnings don't fail the job; errors do.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock is generated by npm 11 on the dev machines; Node 22 bundles
      # npm 10, whose `npm ci` validator rejects npm-11 lock graphs with
      # phantom "Missing: <pkg> from lock file" errors (live-hit 2026-07-05,
      # broke every PR + main). One npm version everywhere.
      - run: npm install -g npm@11
      - run: npm ci --prefer-offline
      - run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock is generated by npm 11 on the dev machines; Node 22 bundles
      # npm 10, whose `npm ci` validator rejects npm-11 lock graphs with
      # phantom "Missing: <pkg> from lock file" errors (live-hit 2026-07-05,
      # broke every PR + main). One npm version everywhere.
      - run: npm install -g npm@11
      - run: npm ci --prefer-offline
      - run: npm test

  # Launch posture: surface high-severity dependency findings without making
  # the first OSS PRs unmergeable. Remove continue-on-error once the remaining
  # semver-major advisories have been adjudicated.
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - name: Audit root dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Audit license-server dependencies
        run: npm audit --audit-level=high
        working-directory: services/license-server
        continue-on-error: true
      - name: Audit relay dependencies
        run: npm audit --audit-level=high
        working-directory: services/relay
        continue-on-error: true
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
        continue-on-error: true

  governance-smoke:
    name: Governance Smoke
    runs-on: ubuntu-latest
    # timeout is load-bearing: this job hung at the 6h GitHub ceiling 3x on
    # 2026-07-11 (open handle keeps node alive after the smoke passes) —
    # ~360 billed min per hang. The step-level `timeout` fails fast; the
    # job-level cap is the backstop.
    timeout-minutes: 10
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock is generated by npm 11 on the dev machines; Node 22 bundles
      # npm 10, whose `npm ci` validator rejects npm-11 lock graphs with
      # phantom "Missing: <pkg> from lock file" errors (live-hit 2026-07-05,
      # broke every PR + main). One npm version everywhere.
      - run: npm install -g npm@11
      - run: npm ci --prefer-offline
      - name: Merge-requires-review governance gate
        run: timeout --signal=KILL 300 env CORTEX_IDE_DATA_DIR=$(mktemp -d) NODE_OPTIONS=--conditions=react-server npx tsx scripts/smoke-merge-requires-review.ts

  # Build removed from the PR lane 2026-07-11 (Q ruling: "runs through money
  # too quick for no reason") — at ~9 billed min/run x ~100 PR runs/week it was
  # the most expensive green job, re-verifying what the real signed build does
  # at ship time anyway. Run on-demand via workflow_dispatch when a remote
  # build check is genuinely wanted.
  build:
    name: Build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock is generated by npm 11 on the dev machines; Node 22 bundles
      # npm 10, whose `npm ci` validator rejects npm-11 lock graphs with
      # phantom "Missing: <pkg> from lock file" errors (live-hit 2026-07-05,
      # broke every PR + main). One npm version everywhere.
      - run: npm install -g npm@11
      - run: npm ci --prefer-offline
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
