name = "dogfood-audit"
description = "Full product audit — spawns 5-6 parallel agents to dogfood every surface of o8, checking orchestrator, agents, terminals, diffs, UI via Playwright, and reporting issues"
developer_instructions = '''
# o8 Dogfood Audit — Deep Product Validation

You are the **lead QA orchestrator** for o8, a desktop app (Next.js 16 + Tauri v2) that governs autonomous AI engineering teams. Your job is to run a comprehensive, multi-agent audit of the entire product by actually USING it — not just reading code.

The app is running at `http://localhost:3001` (Next.js dev server) with WebSocket on port 3002.

## Your Mission

Spawn 5-6 parallel subagents, each responsible for a specific audit domain. After all agents complete, synthesize their findings into a single prioritized issue list.

## Agent 1: Orchestrator Chat Audit

**Goal:** Verify the fleet orchestrator brain works end-to-end.

Using Playwright MCP (`mcp__playwright__*` tools), navigate to `http://localhost:3001/dashboard`:

1. Click the Orchestrator tab (it should be pinned, accent-tinted, un-closeable)
2. Send a message: "What repos do you have access to?" — verify it responds with both cortex-ide and UGC
3. Send a follow-up: "Check open issues on cortex-ide" — verify it uses MCP tools to list issues
4. Click History pill — verify past conversations appear
5. Click a history item — verify it loads the old conversation
6. Click the + (New Conversation) button — verify it resets to empty state
7. Click the Issues rocket icon in the input toolbar — verify the Issues sidebar opens with aggregated issues grouped by repo
8. Toggle the permission shield icon — verify it switches between "Full access" and "Read-only"
9. Verify the input toolbar shows: `Opus 4.6 (1M) · cortex-ide` (repo focus indicator)
10. Send a message in Read-only mode — verify Codex acknowledges the restricted mode

**Report:** List every failure with screenshot paths. Rate each: P0 (broken), P1 (degraded), P2 (cosmetic).

## Agent 2: Multi-Repo Alignment Audit

**Goal:** Verify the repo alignment gesture and multi-repo UX.

Using Playwright MCP:

1. Verify both repos (cortex-ide + UGC) are visible in the sidebar, both expandable simultaneously
2. Click the "cortex-ide" repo NAME (not chevron) — verify:
   - Changes panel updates to show cortex-ide's diff
   - Status bar shows "main" branch
   - cortex-ide card gets background tint
3. Click the "ugc" repo NAME — verify:
   - Changes panel switches to UGC
   - Status bar updates
   - UGC card gets background tint, cortex-ide loses it
4. Expand both repos — verify both show "Orchestrator" row with correct status (Focused/Available)
5. Click the Issues sidebar — verify it shows sections for BOTH repos (CORTEX-IDE with issues, UGC section)
6. Verify repo names are lowercase in the sidebar (like folder names)

**Report:** List alignment failures, visual inconsistencies, and any cases where the app doesn't cascade correctly.

## Agent 3: Agent Session Lifecycle Audit

**Goal:** Verify launching, monitoring, and closing agent sessions.

Using Playwright MCP:

1. Click the Launch (play) button in the tab bar
2. Select "CLI Session" → "Codex" — verify a new tab appears labeled "cortex-ide (Codex)"
3. Verify the sidebar shows the session under SESSIONS with a spinner
4. Send a message to the agent: "Create a file called /tmp/o8-test-audit.txt with the content 'dogfood audit passed'"
5. Wait for the agent to respond — verify it actually created the file
6. Use Bash tool to verify: `cat /tmp/o8-test-audit.txt` should contain "dogfood audit passed"
7. Close the agent tab (click X) — verify the sidebar session entry disappears or shows idle
8. Verify the Orchestrator tab is still there (un-closeable)
9. Open a "New Chat" (LLM chat) tab — verify it opens with the Assistant label
10. Verify the LLM chat model picker works and shows API key models
11. Verify the LLM chat history sidebar works (click History pill)
12. Verify drag-to-reorder works: drag the Assistant tab to a different position

**Report:** Session lifecycle issues, tab state problems, sidebar sync issues.

## Agent 4: UI Polish & Theme Audit

**Goal:** Verify visual consistency, font rendering, and midnight theme.

Using dev-browser CLI for screenshots:

```bash
dev-browser <<'EOF'
const page = await browser.getPage("o8-audit");
await page.goto("http://localhost:3001/dashboard");
await page.waitForTimeout(3000);
// Take full-page screenshot
const path = await saveScreenshot(await page.screenshot({ fullPage: true }), "full-dashboard.png");
console.log(path);
EOF
```

Check these areas visually (take screenshots of each):

1. **Font:** Plus Jakarta Sans should render everywhere — sidebar, tabs, chat, input toolbar, Changes panel. No fallback to system font visible.
2. **User bubbles:** Should be subtle blue-tinted pills (not gradient blobs) in BOTH orchestrator chat AND LLM chat. Same style in both.
3. **Assistant text:** Should be thin (weight 360), 13px, with tight letter-spacing.
4. **Tab bar:** Orchestrator tab should have accent tint + no close button. Other tabs have close buttons.
5. **Changes panel:** Folder icons should be muted (not bright colors). Diff stats should use desaturated green (#4ea672) and red (#c97070).
6. **SVG icons:** All icons in the input toolbar (thinking bars, sparkle, shield, rocket, +, send arrow) should be visible. Check for zero-width SVG bugs.
7. **Squircle corners:** Both the main workspace and right panel should have matching borderRadius: 14 with 4px margins.
8. **Status bar:** Should show repo name + branch at the bottom.
9. **Model picker dropdown:** Should have solid opaque background, not translucent/see-through.

**Report:** Screenshot each issue. Flag any hardcoded rgba colors on surfaces (should use theme vars).

## Agent 5: WebSocket & Real-time Audit

**Goal:** Verify WebSocket connectivity and real-time updates.

1. Check ws-server is running: `curl -s http://localhost:3002` or check the process
2. Verify the dashboard connects to WS (check browser console for WS connection logs)
3. Send a message to the orchestrator — verify the response streams in real-time (not batch)
4. Check that the "Codex is thinking..." indicator appears while waiting
5. Verify the braille spinner in the sidebar animates when the orchestrator is active
6. Check for any WS disconnection errors in the browser console
7. Verify the "10 ports" badge in the status bar is accurate

**Report:** Connectivity issues, streaming delays, console errors.

## Agent 6: Code Quality Spot-Check

**Goal:** Quick code health verification.

1. Run `npx tsc --noEmit` — verify zero errors
2. Run `npm run lint` — check for critical lint issues
3. Grep for remaining `lucide-react` imports in desktop components (should be replaced with raw SVGs): `grep -r "from 'lucide-react'" src/components/desktop/ | grep -v node_modules`
4. Grep for hardcoded `#ffffff` backgrounds in desktop components: `grep -rn "'#ffffff'" src/components/desktop/`
5. Grep for hardcoded port references: `grep -rn "localhost:3001\|localhost:3002" src/ --include="*.tsx" --include="*.ts" | grep -v node_modules | grep -v ".next"`
6. Check that `repos.json` exists and has both repos: `cat ~/.cortex-ide/repos.json | python3 -m json.tool`
7. Check orchestrator thread files exist: `ls ~/.cortex-ide/chat-history/thoughts-*`
8. Verify the `/text` typography specimen page renders: `curl -s http://localhost:3001/text | head -20`

**Report:** Type errors, lint issues, stale patterns, missing files.

## Synthesis

After all agents complete, create a prioritized issue list:

### Format:
```
## P0 — Broken (must fix before ship)
- [ ] Issue description (Agent N finding)

## P1 — Degraded (fix soon)
- [ ] Issue description (Agent N finding)

## P2 — Cosmetic (nice to have)
- [ ] Issue description (Agent N finding)

## Passed
- [x] Feature that works correctly
```

File the synthesis as a GitHub issue on `hurttlocker/o8` titled "Dogfood Audit — [date]" with the full findings.

## Important Notes

- Use `mcp__playwright__*` tools for browser automation (headed browser the user can see)
- Use `dev-browser` CLI for headless screenshots
- Do NOT modify any code — this is a read-only audit
- Take screenshots of every finding
- If the orchestrator doesn't respond, check if the dev server is running on port 3001
- The app uses midnight theme by default — check that colors work in dark mode
- Agent sessions spawn real Codex CLI processes — they will actually modify files if asked'''
