[package]
name = "o8d"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
experimental-ws = ["dep:tokio-tungstenite", "dep:futures-util", "dep:form_urlencoded", "dep:subtle", "dep:uuid"]

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-std", "io-util", "signal", "time"] }
tokio-tungstenite = { version = "0.29", optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
form_urlencoded = { version = "1", optional = true }
subtle = { version = "2", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[[bin]]
name = "o8d"
path = "src/main.rs"
required-features = ["experimental-ws"]
