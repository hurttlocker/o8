session:
  trigger: on-demand
  max_loops: 1
  quality_mode: quality
  cost_cap_usd: 10
  stop_on_cost_cap: true

target:
  repo_path: /Users/marquisehurtt/clawd/repos/cortex
  target_ref: main
  allow_dirty_override: false
  candidate_refs:
    - feat/cross-encoder-reranker-wip

