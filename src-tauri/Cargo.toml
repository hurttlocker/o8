[package]
name = "o8"
version = "0.1.342"
description = "o8 — governance layer for autonomous engineering teams"
authors = ["hurttlocker"]
license = "MIT"
repository = "https://github.com/hurttlocker/o8"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[features]
default = []
# Dev-only: exposes the Tauri webview to AI agents (screenshot + click + eval)
# via an MCP server on a Unix socket. Requires a local checkout of
# tauri-plugin-mcp at `../tauri-plugin-mcp` (sibling of this repo).
# Enable with: `cargo tauri dev --features dev-mcp-plugin`.
# Not needed for normal dev or production.
dev-mcp-plugin = ["dep:tauri-plugin-mcp"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
# Phase 4 (background presence): launch-at-login. Default ON so the pill + Fn
# hotkey work without opening o8. Plugin manipulated only from Rust via the
# `background` module's commands — no JS-side autostart capability needed.
tauri-plugin-autostart = "2"
# Voice P3 hotkeys: OS-global keyboard shortcuts (⌘⇧Space summon, ⌘⌥V paste-last
# dictation, ⌘⇧, open-settings). The Fn / double-tap-Fn gestures stay on the raw
# CGEventTap in fn_hotkey.rs (modifier-only gestures the plugin can't bind).
tauri-plugin-global-shortcut = "2"
# Voice P4 TTS: native audio playback for read-aloud / "say" / spoken Ask
# answers (ElevenLabs + Google direct → MP3 → rodio). Pinned to 0.19 to match
# aqua's stack — rodio 0.20+ changed the OutputStream/Sink/Decoder APIs the
# lifted playback code uses.
rodio = "0.19"
# Already in the lock graph transitively (Tauri's async runtime). Promoted to a
# direct dep so the TTS playback thread can build its own current-thread runtime
# for async reqwest synth before handing MP3 bytes to !Send rodio. Zero binary
# cost; features unify with Tauri's. `sync` adds the oneshot channel + Semaphore
# the Symon voice-agent loop uses for the confirm gate.
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
# Optional: see [features].dev-mcp-plugin above. Relative path so clones can
# opt in by placing the plugin repo next to cortex-ide.
tauri-plugin-mcp = { path = "../../tauri-plugin-mcp", optional = true }
window-vibrancy = "0.6"
rusqlite = { version = "0.31", features = ["bundled"] }

# Issue #755: runtime-download for codebase-memory-mcp static binary.
# All three crates are already in the transitive lock graph (reqwest pulled
# in by tauri-plugin-updater, sha2/hex by other crates) — promoting them to
# direct deps adds zero binary cost.
#   - reqwest: blocking HTTPS GET against github.com (release redirect → S3)
#   - sha2:    SHA-256 verification against the pinned upstream checksum
#   - hex:     hex-encode the digest for comparison against the constant
# rustls (not native-tls) keeps us off OpenSSL link issues on signed builds.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "json", "http2"] }
sha2 = "0.10"
hex = "0.4"

# ── Voice STT engine (lifted from aqua/Symon, de-Symonized) ──
# The Swift sidecar (`helpers/speech_recognizer.swift`) does the audio capture
# + Apple Speech recognition; these Rust crates power the streaming bridge, the
# Gemini polish pass, and the optional Whisper re-transcription.
#
# The STT *streaming* path stays Swift-owned, but the system-wide Symon fold
# (paste-into-focused-app + the global Fn CGEventTap) DOES pull objc2/AppKit/
# CoreGraphics on macOS — see the `[target.'cfg(target_os = "macos")'.dependencies]`
# block below. `paste.rs` needs NSWorkspace/NSRunningApplication/NSPasteboard +
# the Accessibility AX walk, and `fn_hotkey.rs` needs a raw CGEventTap; both are
# genuinely native and cannot be expressed through the Swift helper.
#   - tracing:   logging macros used verbatim by the lifted modules.
#   - hound:     pure-Rust WAV parser for the PCM the Swift helper writes.
#   - flacenc:   pure-Rust WAV→FLAC transcode (~3x) before Gemini upload.
#   - base64:    inline_data audio encode for Gemini + OpenRouter Whisper.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hound = "3.5"
flacenc = "0.5"
base64 = "0.22"

# ── Symon voice agent (tool-calling loop, lifted from aqua, de-Symonized) ──
# The agent parses model-emitted ISO due-dates/event-times into macOS date
# components and stamps the local "current time" into its system prompt. chrono
# (default `clock` feature) is the smallest robust way to do both.
chrono = "0.4"

# Shutdown safety net (issue #719). Both crates are already in the lock graph
# transitively; promoting them to direct deps is zero binary cost. Used to
# tear down spawned Node children on SIGTERM / SIGINT so they don't outlive
# the parent and orphan onto launchd while still holding ports 3001/3002.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

# ── System-wide Symon fold: paste + global Fn hotkey (macOS only) ──
# Versions pinned to aqua/Symon's exact stack so the lifted `paste.rs` +
# `fn_hotkey.rs` compile verbatim and so this objc2 generation links cleanly
# alongside `window-vibrancy 0.6` (which uses the older objc/cocoa generation —
# the two coexist because they bind disjoint symbol sets).
#   - objc2 / objc2-foundation: NSString + objc runtime for the AppKit calls.
#   - objc2-app-kit: NSWorkspace (frontmost app), NSRunningApplication (activate),
#     NSPasteboard (clipboard snapshot/write). NSVisualEffectView/quartz-core are
#     NOT pulled — those are P3 dock-vibrancy only, out of scope for P0-P2.
#   - core-graphics: the CGEventTap (Fn capture) + synthetic Cmd+V CGEvent.
#   - core-foundation: CFDictionary/CFString/CFRunLoop for the AX + tap plumbing.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
core-graphics = "0.24"
core-foundation = "0.10"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSPasteboard", "NSWindow", "NSScreen", "NSColor", "NSResponder", "NSView", "NSGraphics", "NSUserInterfaceItemIdentification"] }
# EventKit — Symon's calendar list. The JXA whose-clause scan took 27s on a
# real 14-calendar set (the 30s osascript cap made "what's on my calendar"
# effectively dead); the indexed EventKit store answers in milliseconds.
objc2-event-kit = { version = "0.3", features = ["EKEventStore", "EKEvent", "EKCalendarItem", "EKCalendar", "EKObject", "EKTypes", "block2"] }
block2 = "0.6"
